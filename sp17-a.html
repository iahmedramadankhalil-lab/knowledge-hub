<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<script>window.KH_COURSE="SP17-A";window.KH_DATA="sp17-a.json";</script>
<title>AI Workflow Automation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: one reading column with a lesson rail that collapses on phones */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --ink:#1d2a26; --muted:#5d6b66; --line:#d9ddd4;
  --accent:#b8661c; --accent-soft:#f6e6d4; --good:#2e7d4f; --bad:#b23a3a; --code:#eef0ea;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1c2421; --ink:#e7ece8; --muted:#9aa8a2; --line:#2e3935;
  --accent:#e09a4f; --accent-soft:#3a2a1a; --good:#5cc489; --bad:#e07474; --code:#232c29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1c2421; --ink:#e7ece8; --muted:#9aa8a2; --line:#2e3935;
  --accent:#e09a4f; --accent-soft:#3a2a1a; --good:#5cc489; --bad:#e07474; --code:#232c29; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);gap:20px}}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
a{color:inherit}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;direction:ltr;text-align:right}
/* rail */
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:18px}
@media (max-width:820px){nav.rail{position:static}}
.brand{font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none}
.mod{display:flex;flex-direction:column;gap:2px}
.mod h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:4px}
.mod a,.mod span.soon{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:6px;text-decoration:none;font-size:15px;line-height:1.5}
.mod a:hover{background:var(--surface)}
.mod a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.mod span.soon{color:var(--muted);opacity:.7}
.tick{font-family:var(--mono);font-size:12px;min-width:2.4em;color:var(--muted);direction:ltr}
.done .tick{color:var(--good)}
/* main */
main{min-width:0;display:flex;flex-direction:column;gap:28px}
.hero{display:flex;flex-direction:column;gap:10px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(28px,4vw,40px)}
.hero .en{font-family:var(--mono);color:var(--muted);direction:ltr;text-align:right;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.outcomes{margin:0;padding-inline-start:22px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.modcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px}
.modcard.off{opacity:.6}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:15px;padding:8px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lesson{max-width:68ch}
.lesson h2{font-size:22px;margin-top:36px;margin-bottom:8px;padding-top:12px;border-top:1px solid var(--line)}
.lesson p,.lesson li{margin-block:.6em}
.lesson blockquote{margin:0;padding:12px 16px;border-inline-start:3px solid var(--accent);background:var(--surface);direction:ltr;text-align:left;font-style:italic}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tablebox table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.tablebox th,.tablebox td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tablebox th{font-family:var(--display);font-weight:500;background:var(--code)}
.tablebox td:first-child{font-weight:600;white-space:nowrap}
.tablebox td:last-child{direction:ltr;text-align:left}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.qcard p{margin:0;font-weight:600}
.opt{font:inherit;text-align:start;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.why{font-size:15px;color:var(--muted)}
.why b{color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.score{font-family:var(--display);font-size:22px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <nav class="rail" id="rail" aria-label="محتوى الكورس"></nav>
  <main id="main"><p class="note">جاري تحميل الكورس…</p></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var KEY="kh-progress-"+(window.KH_COURSE||"ST01-CRS01"), course=null, lessons=[];
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
  function save(p){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
  var prog=load();
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function slug(id){return id.toLowerCase()}

  function rail(current){
    var h='<a class="brand" href="/dashboard">Knowledge Hub</a><a class="note" href="#home">صفحة الكورس</a><div class="eyebrow">'+course.courseId+'</div>';
    course.modules.forEach(function(m){
      h+='<div class="mod"><h3>'+esc(m.id+" · "+(m.titleAr||m.titleEn))+'</h3>';
      m.lessons.forEach(function(l){
        var n=l.id.replace("L","").replace("-",".");
        if(m.available){
          var d=prog[l.id]?" done":"";
          h+='<a class="'+d+'" href="#'+slug(l.id)+'"'+(current===l.id?' aria-current="page"':'')+'><span class="tick">'+(prog[l.id]?"✓ ":"")+n+'</span>'+esc(l.titleAr)+'</a>';
        } else h+='<span class="soon"><span class="tick">'+n+'</span>'+esc(l.titleEn)+'</span>';
      });
      if(m.quiz) h+='<a href="#quiz-'+slug(m.id)+'"'+(current==="quiz-"+m.id?' aria-current="page"':'')+'><span class="tick">'+(prog["quiz-"+m.id]!=null?"✓":"")+'</span>Quiz الـ Module</a>';
      h+='</div>';
    });
    document.getElementById("rail").innerHTML=h;
  }
  function pct(){var a=lessons.length,d=lessons.filter(function(l){return prog[l.id]}).length;return a?Math.round(100*d/a):0}

  function home(){
    var c=course,h='<section class="hero"><div class="eyebrow">'+esc(c.stageTitle)+'</div><h1>'+esc(c.titleAr)+'</h1><div class="en">'+esc(c.titleEn)+'</div>'
      +'<div class="meta"><span class="chip">'+c.level+'</span><span class="chip">'+c.hours+' ساعة</span><span class="chip">آخر مراجعة '+c.lastReviewed+'</span></div>'
      +'<p>'+esc(c.descriptionAr)+'</p><div class="bar" aria-label="التقدم"><i style="width:'+pct()+'%"></i></div><div class="note">خلصت '+pct()+'% من دروس الكورس. التقدم محفوظ على المتصفح ده بس.</div></section>'
      +'<section><h2>في آخر الكورس هتقدر</h2><ol class="outcomes">'+c.learningOutcomes.map(function(o){return '<li>'+esc(o)+'</li>'}).join("")+'</ol></section>'
      +'<section><h2>الـ Modules</h2><div class="modgrid">';
    c.modules.forEach(function(m){
      h+='<div class="modcard'+(m.available?'':' off')+'"><div class="eyebrow">'+m.id+' · '+m.lessons.length+' دروس</div><h3>'+esc(m.titleAr)+'</h3><div class="note" dir="ltr" style="text-align:right">'+esc(m.titleEn)+'</div>'
        +(m.available?'<a class="btn" href="#'+slug(m.lessons[0].id)+'">ابدأ</a>':'<span class="note">قريبًا</span>')+'</div>';
    });
    h+='</div></section><section><h2>المراجع</h2><ul class="note">'+c.references.map(function(r){return '<li dir="ltr" style="text-align:left">'+esc(r)+'</li>'}).join("")+'</ul></section>';
    return h;
  }

  function qblock(qs,key){
    return qs.map(function(q,i){
      return '<div class="qcard" data-q="'+i+'"><p>'+(i+1)+'. '+esc(q.prompt)+'</p>'
        +q.options.map(function(o,j){return '<button class="opt" data-k="'+key+'" data-q="'+i+'" data-o="'+j+'">'+esc(o)+'</button>'}).join("")
        +'<div class="why" hidden></div></div>';
    }).join("");
  }

  function lessonView(id){
    var idx=lessons.findIndex(function(l){return l.id===id}),l=lessons[idx];
    var body=marked.parse(l.bodyMd).replace(/<table>/g,'<div class="tablebox"><table>').replace(/<\/table>/g,'</table></div>');
    var prev=lessons[idx-1],next=lessons[idx+1];if(next&&next.mod!==l.mod)next=null;
    return '<article class="lesson"><div class="eyebrow">'+l.mod+' · Lesson '+l.id.replace("L","").replace("-",".")+'</div><h1 style="font-size:clamp(26px,3.6vw,34px);margin-top:6px">'+esc(l.titleAr)+'</h1>'
      +'<div class="note" dir="ltr" style="text-align:right">'+esc(l.titleEn)+'</div>'+body
      +'<h2>Knowledge check</h2>'+qblock(l.check||[],"c:"+l.id)+'</article>'
      +'<div class="pager">'+(prev?'<a class="btn ghost" href="#'+slug(prev.id)+'">→ الدرس اللي فات</a>':'<span></span>')
      +'<button class="btn" id="markdone">'+(prog[l.id]?'متعلّم كمخلص ✓':'خلصت الدرس')+'</button>'
      +(next?'<a class="btn ghost" href="#'+slug(next.id)+'">الدرس الجاي ←</a>':'<a class="btn ghost" href="#quiz-'+slug(l.mod)+'">Quiz الـ Module ←</a>')+'</div>';
  }

  function quizView(mid){
    var m=course.modules.find(function(x){return x.id===mid}),last=prog["quiz-"+mid];
    return '<section class="hero"><div class="eyebrow">'+m.id+' · Quiz</div><h1>Quiz: '+esc(m.titleAr)+'</h1>'
      +'<p class="note">'+m.quiz.length+' أسئلة. علامة النجاح 80%.'+(last!=null?' آخر نتيجة: '+last+'%.':'')+'</p></section>'
      +qblock(m.quiz,"q:"+mid)+'<div class="pager"><span class="score" id="score"></span><a class="btn ghost" href="#home">رجوع للكورس</a></div>';
  }

  var answers={};
  document.addEventListener("click",function(e){
    var b=e.target.closest(".opt");
    if(b){
      var k=b.dataset.k,qi=+b.dataset.q,oi=+b.dataset.o,parts=k.split(":");
      var set=parts[0]==="c"?lessons.find(function(l){return l.id===parts[1]}).check:course.modules.find(function(m){return m.id===parts[1]}).quiz;
      var q=set[qi],card=b.closest(".qcard");
      card.querySelectorAll(".opt").forEach(function(o){o.disabled=true;if(+o.dataset.o===q.correct)o.classList.add("right")});
      if(oi!==q.correct)b.classList.add("wrong");
      var w=card.querySelector(".why");w.hidden=false;w.innerHTML='<b>'+(oi===q.correct?"إجابة صح.":"مش دي.")+'</b> '+esc(q.explanation);
      if(parts[0]==="q"){
        answers[qi]=oi===q.correct;
        if(Object.keys(answers).length===set.length){
          var s=Math.round(100*Object.values(answers).filter(Boolean).length/set.length);
          prog["quiz-"+parts[1]]=s;save(prog);
          document.getElementById("score").textContent="نتيجتك "+s+"% · "+(s>=80?"عدّيت":"محتاج تراجع وتعيد");
          rail("quiz-"+parts[1]);
        }
      }
      return;
    }
    if(e.target.id==="markdone"){
      var id=location.hash.slice(1).toUpperCase();prog[id]=!prog[id];save(prog);route();
    }
  });

  function route(){
    var h=(location.hash||"#home").slice(1),main=document.getElementById("main");answers={};
    if(/^l\d-\d$/.test(h)&&lessons.some(function(l){return slug(l.id)===h})){var id=h.toUpperCase();rail(id);main.innerHTML=lessonView(id)}
    else if(/^quiz-m\d$/.test(h)){var mid=h.slice(5).toUpperCase();rail("quiz-"+mid);main.innerHTML=quizView(mid)}
    else{rail("");main.innerHTML=home()}
    window.scrollTo(0,0);
  }

  fetch(window.KH_DATA||"data/st01-crs01.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(c){
    course=c;c.modules.forEach(function(m){if(m.available)m.lessons.forEach(function(l){l.mod=m.id;lessons.push(l)})});
    window.addEventListener("hashchange",route);route();
  }).catch(function(){document.getElementById("main").innerHTML='<p class="err">ملف الكورس ما اتحملش. لو بتفتح الصفحة من الكمبيوتر مباشرة، شغّلها من سيرفر محلي (اقرا README).</p>'});
})();
</script>

</body>
</html>
